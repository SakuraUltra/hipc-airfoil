  <title id="hero-title">AIRFOIL CFD — Parallel computing on CPUs and GPUs</title>
  <desc id="hero-desc">Repository banner for a computational fluid dynamics solver with OpenMP, MPI and CUDA implementations. The right-hand illustration uses an analytic NACA 2412 airfoil outline and decorative streamlines. It is not a simulation result or a performance claim.</desc>
